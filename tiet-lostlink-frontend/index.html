<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2438F0" />
    <script>
      // set the theme before the page paints so there is no light flash in dark mode
      (function () {
        try {
          var t = localStorage.getItem('lostlink-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
          if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0a0e1c');
        } catch (e) {}
      })();
    </script>
    <title>LostLink — campus lost and found</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
